name: Update LeetCode

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch Data
        run: |
          curl -s https://alfa-leetcode-api.onrender.com/NaitikVerma > data.json

      - name: Extract Data
        run: |
          echo "EASY=$(jq '.easySolved' data.json)" >> $GITHUB_ENV
          echo "MEDIUM=$(jq '.mediumSolved' data.json)" >> $GITHUB_ENV
          echo "HARD=$(jq '.hardSolved' data.json)" >> $GITHUB_ENV
          echo "TOTAL=$(jq '.totalSolved' data.json)" >> $GITHUB_ENV
          echo "RANK=$(jq '.ranking' data.json)" >> $GITHUB_ENV
          echo "CONTRI=$(jq '.contributionPoint' data.json)" >> $GITHUB_ENV

      - name: Update README
        run: |
          echo "## <img src=\"https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/leetcode.svg\" width=\"25\"/> LeetCode Stats" > README.md
          echo "" >> README.md
          echo "| 📊 Category | 🚀 Stats |" >> README.md
          echo "|------------|--------|" >> README.md
          echo "| 🟢 Easy | ${EASY} |" >> README.md
          echo "| 🟡 Medium | ${MEDIUM} |" >> README.md
          echo "| 🔴 Hard | ${HARD} |" >> README.md
          echo "| 📌 Total | ${TOTAL} |" >> README.md
          echo "| 🏆 Rank | ${RANK} |" >> README.md
          echo "| 🔥 Contribution | ${CONTRI} |" >> README.md

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "update stats" || echo "no change"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
