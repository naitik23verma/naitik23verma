name: Update LeetCode Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Fetch Data
        run: |
          curl -s https://alfa-leetcode-api.onrender.com/NaitikVerma > data.json

      - name: Extract Data
        run: |
          EASY=$(jq -r '.easySolved' data.json)
          MEDIUM=$(jq -r '.mediumSolved' data.json)
          HARD=$(jq -r '.hardSolved' data.json)
          TOTAL=$(jq -r '.totalSolved' data.json)
          RANK=$(jq -r '.ranking' data.json)
          CONTRI=$(jq -r '.contributionPoint' data.json)

          echo "EASY=$EASY" >> $GITHUB_ENV
          echo "MEDIUM=$MEDIUM" >> $GITHUB_ENV
          echo "HARD=$HARD" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "RANK=$RANK" >> $GITHUB_ENV
          echo "CONTRI=$CONTRI" >> $GITHUB_ENV

      - name: Generate SVG
        run: |
          cat <<EOF > leetcode-stats.svg
          <svg width="420" height="220" xmlns="http://www.w3.org/2000/svg">
            <style>
              .title { font: bold 18px sans-serif; fill: #facc15; }
              .text { font: 14px sans-serif; fill: #ffffff; }
            </style>

            <rect width="100%" height="100%" fill="#0f172a" rx="10"/>

            <text x="20" y="30" class="title">LeetCode Stats</text>
            <text x="20" y="60" class="text">Easy: ${EASY}</text>
            <text x="20" y="80" class="text">Medium: ${MEDIUM}</text>
            <text x="20" y="100"

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add leetcode-stats.svg
          git commit -m "update leetcode stats" || echo "no change"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
